name: Backend checks
run-name: "Tests for project 12 and 13: ${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - main
      - automated-tests
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automated_tests:
    if: ${{ github.repository != 'tripleten-com/se_project_express' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the backend
        uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install project dependencies
        run: npm ci --loglevel=error --no-fund --no-audit
      - name: Lint the backend
        run: |
          npm run lint
          npm run format:check
      - name: Run Jest with disposable databases and coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test

  read_sprint_file:
    if: ${{ github.repository != 'tripleten-com/se_project_express' }}
    runs-on: ubuntu-latest
    outputs:
      sprint: ${{ steps.sprint.outputs.SPRINT_NUMBER }}
    steps:
      - name: Print the repository
        run: echo "Repository ${{ github.repository }}"
      - name: Set up GitHub Actions
        uses: actions/checkout@v4
      - name: Check if sprint file exists
        run: bash .github/bin/check-sprint.sh
      - name: Get sprint number
        id: sprint
        run: echo "SPRINT_NUMBER=$(cat sprint.txt)" >> "$GITHUB_OUTPUT"

  test_endpoints:
    if: ${{ github.repository != 'tripleten-com/se_project_express' }}
    runs-on: ubuntu-latest
    needs: read_sprint_file
    steps:
      - name: Set up GitHub Actions
        uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Get testing lib 12
        id: testing-lib-12
        if: ${{ needs.read_sprint_file.outputs.sprint == '12' }}
        run: git clone --depth 1 https://github.com/tripleten-com/tests-12-public.git .course-tests

      - name: Get testing lib 13
        id: testing-lib-13
        if: ${{ needs.read_sprint_file.outputs.sprint == '13' }}
        run: git clone --depth 1 https://github.com/tripleten-com/tests-13-public.git .course-tests

      - name: Installing dependencies
        run: npm ci --loglevel=error --no-fund --no-audit

      - name: List project and course test files
        run: |
          ls -la
          ls -la .course-tests

      - name: Run test config
        working-directory: .course-tests
        run: bash ./bin/test-config.sh

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.6.0
        with:
          mongodb-version: "4.4"

      - name: Run prepare-test-endpoints
        if: ${{ needs.read_sprint_file.outputs.sprint == '12' }}
        working-directory: .course-tests
        run: bash ./bin/prepare-test-endpoints.sh

      - name: Install wait-port
        run: npm install -g wait-port

      - name: Generate a signing secret for the temporary course server
        run: |
          node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'JWT_SECRET=' + require('node:crypto').randomBytes(32).toString('hex') + '\n')"

      - name: Run server
        run: npm run start & wait-port -t 30000 localhost:3001

      - name: Run test endpoints
        working-directory: .course-tests
        run: bash ./bin/test-endpoints.sh
